name: Sync from wickra

# Two kinds of value here are decided elsewhere: the indicator counts and
# wickra's released version. Both used to arrive by push -- wickra's
# sync-about.yml cloned this repository with a personal access token and
# committed them. The token carried write access to four repositories,
# administration rights on wickra and admin:org, and existed for no other
# reason.
#
# This pulls instead. A schedule is also the only trigger that can work: the
# values change in the OTHER repositories, so a push here is not the event that
# makes this site wrong. The delay is bounded by the hour and costs nothing --
# nobody reads documentation expecting a figure that moved in the last hour.
#
# The counts are set by the org's one rule set, wickra-lib/.github's
# scripts/sync-counts.mjs, checked out at a pinned commit. It reads them at the
# latest releases -- this site documents what can be installed, not what is
# merged -- and sets every count a page states by the rule that applies: the
# core's on the pages about the catalogue, the backtest registry's where a page
# describes a product that resolves through it (the screener, feature-store,
# genome and darwin rows of Ecosystem.md). A sed over four files used to catch
# one phrasing and miss the Quickstarts, Ecosystem.md and every other wording.
# The page-derived counts (per family, the sidebar, "N deep-dive pages") stay
# with scripts/sync-doc-counts.mjs, which CI checks against the pages.
on:
  schedule:
    - cron: "43 * * * *" # hourly at :43, clear of refresh-badges at :17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Pull the counts and the released version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commits the corrected values back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # One file, read-only, at a pinned commit. It lands beside the site and is
      # excluded from git, so the commit below cannot pick it up.
      - name: Check out the count rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wickra-lib/.github
          ref: 18562d915e1a303e6a155c6a8a32aef14e2fcd17
          path: .wickra-org
          sparse-checkout: scripts/sync-counts.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Set the indicator counts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo ".wickra-org/" >> .git/info/exclude
          node .wickra-org/scripts/sync-counts.mjs --repo wickra-docs

      # The released version, not the one on main: between a bump merging and its
      # tag being pushed, Cargo.toml is ahead of anything a reader can install.
      - name: Read the released version from wickra
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh api repos/wickra-lib/wickra/releases/latest -q '.tag_name')
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::latest release tag '${tag}' is not a plain vX.Y.Z; refusing to write it"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "wickra's latest release is ${version}"

      - name: Apply the version
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^(\| \[?(crates\.io|PyPI|npm|NuGet|Maven Central|Go|r-universe)\]?.*\| )[0-9]+\.[0-9]+\.[0-9]+/\1${V}/" overview.md
          sed -i -E "s/(published crate is at version .)[0-9]+\.[0-9]+\.[0-9]+/\1${V}/" Quickstart-Rust.md
          sed -i -E "s|<version>[0-9]+\.[0-9]+\.[0-9]+</version>|<version>${V}</version>|" Quickstart-Java.md
          sed -i -E "s|(org\.wickra:wickra:)[0-9]+\.[0-9]+\.[0-9]+|\1${V}|" Quickstart-Java.md

      - name: Commit if changed
        id: commitcheck
        env:
          V: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "counts current and version ${V}; nothing to commit"
            echo "commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "commit=true" >> "$GITHUB_OUTPUT"

      - name: Commit (signed)
        if: steps.commitcheck.outputs.commit == 'true'
        uses: wickra-lib/.github/actions/signed-commit@da1bd395c27f33dbed632c8e4e48e12f85394858 # v1.1.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          message: "chore: sync the indicator counts and the released version (${{ steps.version.outputs.version }})"
          paths: .
