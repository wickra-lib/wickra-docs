name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # VitePress fails the build on dead internal links by default, so this
      # job doubles as the internal-link checker.
      - run: npm run build

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uses the repo's .markdownlint.jsonc (structural rules on, intentional
      # wiki-export style noise off).
      - uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          # Root pages plus the relocated indicator catalogue under Indicators/.
          globs: |
            *.md
            Indicators/*.md

  doc-counts:
    name: Doc counts in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Every page-derived count (deep-dive total, per-family breakdown, the
      # alphabetical index, the sidebar) is regenerated from Indicators/*.md by
      # this script. The check fails if any of them drifts — run
      # `node scripts/sync-doc-counts.mjs` to fix.
      - run: node scripts/sync-doc-counts.mjs --check

  rust-snippets:
    name: Rust doc snippets compile
    runs-on: ubuntu-latest
    steps:
      # The docs live here; the wickra crate source is checked out alongside so
      # every runnable ```rust block is compiled against the real API. A doc
      # snippet that drifts from the library now fails CI here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: docs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: wickra-lib/wickra
          path: wickra
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # zizmor: ignore[impostor-commit] pinned to the stable-tag SHA (2026-03-27); tag-pinned, not a branch commit
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: wickra
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Compile every runnable rust snippet
        working-directory: docs
        run: WICKRA_CRATE_PATH="$GITHUB_WORKSPACE/wickra/crates/wickra" node scripts/check-rust-snippets.mjs

  native-snippets:
    name: Python/Node doc snippets reference real names
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # The native bindings (Python / Node.js / WASM) expose TA-Lib-style
      # aliases, so a snippet that names the canonical type raises at runtime.
      # These checks fail if any ```python / ```js block references an indicator
      # the published module does not export. WASM shares the Node aliases.
      # Same for the Python snippets: the published wheel, current version.
      - run: python -m pip install --upgrade wickra numpy # zizmor: ignore[adhoc-packages]
      - name: Check Python doc snippets
        run: python scripts/check_doc_examples.py
      # Naming every symbol correctly is not the same as working: twenty-five
      # blocks resolved every name and still raised, by calling `update` with the
      # whole derivatives tick, feeding a close-only series to an indicator that
      # takes high/low/close, or reaching for `.shape` on a type without one.
      - name: Run Python doc snippets
        run: python scripts/run_doc_snippets.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The snippets are checked against the package people install, at whatever
      # version npm serves today -- that is the point of the job, not a lockfile gap.
      - run: npm install --no-save wickra # zizmor: ignore[adhoc-packages]
      - name: Check Node.js doc snippets
        run: node scripts/check-doc-examples.mjs
      - name: Run Node.js doc snippets
        run: node scripts/run-doc-snippets.mjs
