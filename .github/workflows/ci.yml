name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # VitePress fails the build on dead internal links by default, so this
      # job doubles as the internal-link checker.
      - run: npm run build

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Uses the repo's .markdownlint.jsonc (structural rules on, intentional
      # wiki-export style noise off).
      - uses: DavidAnson/markdownlint-cli2-action@05f32210e84442804257b2a6f20b273450ec8265 # v19
        with:
          globs: "*.md"

  rust-snippets:
    name: Rust doc snippets compile
    runs-on: ubuntu-latest
    steps:
      # The docs live here; the wickra crate source is checked out alongside so
      # every runnable ```rust block is compiled against the real API. A doc
      # snippet that drifts from the library now fails CI here.
      - uses: actions/checkout@v6
        with:
          path: docs
      - uses: actions/checkout@v6
        with:
          repository: wickra-lib/wickra
          path: wickra
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch, 2026-03-27
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: wickra
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compile every runnable rust snippet
        working-directory: docs
        run: WICKRA_CRATE_PATH="$GITHUB_WORKSPACE/wickra/crates/wickra" node scripts/check-rust-snippets.mjs
