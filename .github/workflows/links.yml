name: Link check

# External link rot is non-deterministic (third-party sites go down, rate-limit,
# or move), so this runs on a weekly schedule and on demand rather than blocking
# every PR. Internal links are already verified by the VitePress build in ci.yml;
# lychee here only checks http(s) URLs. --root-dir lets it resolve the absolute
# root-relative internal links (e.g. /Indicators/Indicator-Ema) to local files
# so the http(s)-only scheme filter skips them instead of erroring on them.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: External links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --no-progress --root-dir "${{ github.workspace }}" "*.md" "Indicators/*.md" ".vitepress/**/*.ts"
          fail: true
