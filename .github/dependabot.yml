version: 2
updates:
  # The site's own npm dependencies: VitePress and Vue, the badge renderer
  # (sharp, resvg).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(npm)"
    groups:
      site:
        patterns: ["*"]

  # The 5 workflows here (ci, links, refresh-badges, sync-from-wickra, zizmor)
  # pin their actions by full SHA, which only something watching them will ever
  # move.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "deps(actions)"
    groups:
      github-actions:
        patterns: ["*"]
