# lychee external-link checker config (see .github/workflows/links.yml).
# Only http(s) URLs are checked; relative/internal links are validated by the
# VitePress build. Loopback and private addresses (e.g. the localhost dev-server
# URL shown in the docs) are skipped.

max_retries = 3
retry_wait_time = 2
timeout = 20

# Treat these as success: OK, partial content, and rate-limited (transient).
accept = [200, 206, 429]

scheme = ["https", "http"]
exclude_all_private = true
