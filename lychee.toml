# lychee external-link checker config (see .github/workflows/links.yml).
# Only http(s) URLs are checked; relative/internal links are validated by the
# VitePress build. Loopback and private addresses (e.g. the localhost dev-server
# URL shown in the docs) are skipped.

max_retries = 3
retry_wait_time = 2
timeout = 20

# Treat these as success: OK, partial content, and rate-limited (transient).
accept = [200, 206, 429]

scheme = ["https", "http"]
exclude_all_private = true

# Known false positives (the URLs are valid; lychee just can't verify them):
# - config.ts builds the per-page canonical with a `${path}` template literal;
#   lychee scans the .ts as text and extracts the unevaluated placeholder, which
#   is not a real URL (reported as /$%7Bpath%7D).
# - npmjs.com returns 403 to non-browser requests (anti-scraping); the package
#   page is live in a browser.
exclude = [
  'docs\.wickra\.org/\$(\{|%7B)path',
  'www\.npmjs\.com/package/wickra',
  # product marketing subdomains go live once Cloudflare Pages is configured;
  # excluded until then so the scheduled link check stays green. Remove on launch.
  '(exchange|backtest|terminal|screener|xray|radar|copilot|shazam)\.wickra\.org',
]
